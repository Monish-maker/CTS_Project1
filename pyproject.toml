[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelllm"
version = "0.1.0"
description = "Contract-driven AI/LLM application security scanner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.5", "types-PyYAML>=6.0"]

[project.scripts]
sentinelllm = "sentinelllm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]
