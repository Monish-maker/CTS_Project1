target:
  url: "http://127.0.0.1:8000"
  authentication:
    required: false
    scheme: "Bearer"
    header_name: "Authorization"
    environment_variable: "SENTINEL_TARGET_TOKEN"

llm:
  provider: "deterministic"
  model: ""
  endpoint: null
  api_key_environment_variable: "SENTINEL_LLM_API_KEY"
  timeout: 20
  retries: 1

scan:
  timeout: 10
  retries: 2
  dry_run: true
  max_iterations: 5
  max_jobs: 50
  max_requests: 50
  max_requests_per_endpoint: 10
  max_duration_seconds: 300
  concurrency: 1
  minimum_request_interval_seconds: 0
  discovery_paths: ["/openapi.json", "/swagger.json"]
  allowed_methods: ["GET", "POST"]

attacks:
  enabled:
    - prompt_injection
    - sensitive_information_disclosure
    - excessive_agency
    - supply_chain
    - data_and_model_poisoning
    - unbounded_consumption
    - misinformation
    - hidden_context_exposure
    - vector_and_embedding_weaknesses
    - improper_output_handling

reporting:
  output_directory: "./reports"
